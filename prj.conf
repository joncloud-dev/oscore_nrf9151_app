# SPDX-License-Identifier: Apache-2.0
#
# Minimal configuration for the OSCORE cloud sample on nRF9151. Distilled from
# the Asset-Tracker-Template prj.conf: keeps only what the oscore_cloud library
# and its plain main()-loop session helper need (no zbus / SMF / storage / FOTA /
# location / diagnostics).

CONFIG_NCS_SAMPLES_DEFAULTS=y
# The diagnostics module (below) installs its own k_sys_fatal_error_handler to
# capture a crash snapshot before rebooting, so Zephyr's default reset-on-fatal
# handler must be disabled to keep a single definition of the symbol.
CONFIG_RESET_ON_FATAL_ERROR=n

# This sample drives OSCORE directly from the main thread, so main needs the
# headroom ATT gives its dedicated 14 KB cloud thread: with VLAs off, uoscore
# stages its plaintext[]/ciphertext[] buffers (OSCORE_MAX_PLAINTEXT_LEN=1536 +
# tag) plus the CoAP/telemetry frame on the caller's stack. 8 KB overflows on
# the first telemetry protect; 16 KB matches the known-good nrf9151_client.
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_HEAP_MEM_POOL_SIZE=12288
CONFIG_HEAP_MEM_POOL_IGNORE_MIN=y
# Deferred AT monitors heap-copy notifications in the IPC ISR; 1 KiB default
# exhausts after a registration/PDN notification burst (e.g. post-flight).
CONFIG_AT_MONITOR_HEAP_SIZE=6144
CONFIG_EXTRA_EXCEPTION_INFO=y

# ---------------------------------------------------------------------------
# TF-M full profile: PSA crypto service required by uoscore-uedhoc (opaque
# master-secret key lives in the TF-M secure domain).
# ---------------------------------------------------------------------------
CONFIG_TFM_PROFILE_TYPE_NOT_SET=y
CONFIG_PSA_CRYPTO_DRIVER_CC3XX=y
CONFIG_TFM_PSA_FRAMEWORK_HAS_MM_IOVEC=y
CONFIG_PSA_WANT_ALG_CTR_DRBG=y

# Put TF-M's secure log on UART0 and share that instance with the non-secure
# app so both TF-M and the application console/shell come out on the DK's VCOM.
# Without this, TF-M defaults to a separate secure UART (uart1) and the console
# ends up on a port you are not watching -> "no UART output".
CONFIG_TFM_SECURE_UART0=y
CONFIG_TFM_SECURE_UART_SHARE_INSTANCE=y

# ---------------------------------------------------------------------------
# Networking: modem-offloaded sockets on the nRF91 (no native IP stack).
# ---------------------------------------------------------------------------
CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_NATIVE=n
CONFIG_NET_IPV4=y

CONFIG_NRF_MODEM_LIB=y
CONFIG_LTE_LINK_CONTROL=y
CONFIG_LTE_NETWORK_MODE_LTE_M_NBIOT_GPS=y

# LTE Link Control submodules used by the network module (src/network.c):
#  - PDN: the network module treats the default-PDN activate/deactivate events
#    as the authoritative link-up/down signal (an IP bearer is actually usable),
#    rather than raw registration status.
#  - MODEM_EVENTS: surfaces attach reset-loop and light/full search-done
#    notifications (enabled automatically by the lte_lc CFUN hook).
#  - PSM/eDRX: request power-saving parameters and forward the negotiated values
#    to the application as network events.
CONFIG_LTE_LC_PDN_MODULE=y
CONFIG_LTE_LC_MODEM_EVENTS_MODULE=y
CONFIG_LTE_LC_PSM_MODULE=y
CONFIG_LTE_PSM_REQ=y
CONFIG_LTE_LC_EDRX_MODULE=y
CONFIG_LTE_EDRX_REQ=y
CONFIG_LTE_PSM_REQ_RPTAU_SECONDS=7200
CONFIG_LTE_PSM_REQ_RAT_SECONDS=6
# Modem info: feeds the diagnostics vitals heartbeat (RSRP/SNR/temp/band, tx/rx
# airtime) and the one-shot device-info report (modem firmware, IMEI, ICCID).
CONFIG_MODEM_INFO=y
CONFIG_MODEM_INFO_ADD_NETWORK=y

# Wall-clock time (optional telemetry timestamp; the server also stamps).
CONFIG_DATE_TIME=y

# ---------------------------------------------------------------------------
# GNSS location + A-GNSS assistance over OSCORE.
#
# The Location library runs a GNSS-only search (src/location.c). A-GNSS
# assistance is fetched from the OSCORE cloud, not nRF Cloud. The Location
# library only *exposes* the external assistance-request event
# (LOCATION_EVT_GNSS_ASSISTANCE_REQUEST + event_data.agnss_request) when
# CONFIG_NRF_CLOUD_AGNSS is set, which in turn lives under CONFIG_NRF_CLOUD.
# We therefore enable the nRF Cloud *library* for the request plumbing only:
# with no transport (no NRF_CLOUD_MQTT/COAP) and CONFIG_LOCATION_SERVICE_EXTERNAL
# =y, no connection is made — the library hands the request to our handler,
# which fetches over OSCORE and injects via nrf_modem_gnss_agnss_write().
CONFIG_LOCATION=y
CONFIG_LOCATION_DATA_DETAILS=y
CONFIG_LOCATION_METHOD_GNSS=y
CONFIG_LOCATION_SERVICE_EXTERNAL=y
CONFIG_NRF_CLOUD=y
CONFIG_NRF_CLOUD_AGNSS=y
CONFIG_LOCATION_REQUEST_DEFAULT_GNSS_TIMEOUT=120000
CONFIG_LOCATION_REQUEST_DEFAULT_TIMEOUT=120000

# The Location library always builds scan_cellular.c, which requires an AT
# monitor heap large enough to hold neighbor-cell measurement notifications.
CONFIG_AT_MONITOR_HEAP_SIZE=1024

# oscore_cloud A-GNSS client (POST /a, Block2 CBOR -> nrf_modem_gnss_agnss_write).
CONFIG_OSCORE_CLOUD_AGNSS=y

# oscore_cloud predicted-GNSS (P-GPS) client (POST /p, Block2 CBOR -> flash
# window ring -> nrf_modem_gnss_agnss_write). Exposes the `pgps fetch` /
# `pgps fix` / `pgps store` shell commands.
CONFIG_OSCORE_CLOUD_PGPS=y
# Keep the downloaded windows in the pgps_storage partition on external flash
# (boards/nrf9151dk_nrf9151_ns.overlay), one 4 KiB slot per 4 h window. 84 slots
# is the full 14-day horizon the /p contract defines, and it survives reboots so
# the device can fix from stored predictions while completely offline -- which is
# what the `soak` bench test measures.
CONFIG_OSCORE_CLOUD_PGPS_STORE=y
CONFIG_OSCORE_CLOUD_PGPS_STORE_SLOTS=84
# Windows per POST /p. A whole horizon cannot arrive in one response (84 windows
# is ~97 kB against a 12 KiB accumulation buffer), so a long fetch is split into
# this many windows per request, one request per main-loop iteration.
CONFIG_OSCORE_CLOUD_PGPS_FETCH_BATCH=6

# ---------------------------------------------------------------------------
# OSCORE cloud transport.
# ---------------------------------------------------------------------------
CONFIG_COAP=y
CONFIG_UOSCORE=y
CONFIG_OSCORE_USE_EDHOC=n
CONFIG_ZCBOR=y
CONFIG_ZCBOR_CANONICAL=y
CONFIG_MBEDTLS=y
CONFIG_PSA_WANT_ALG_HMAC=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_KEY_TYPE_HMAC=y
CONFIG_PSA_WANT_ALG_CCM=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y
#CONFIG_OSCORE_SERVER_IP="23.88.115.159"
CONFIG_OSCORE_SERVER_IP="34.148.113.218"

CONFIG_COAP_MAX_RETRANSMIT=3
CONFIG_COAP_INIT_ACK_TIMEOUT_MS=5000

# ---------------------------------------------------------------------------
# oscore_cloud library: enable the client and the framework-free session helper
# (connect / backoff / send_telemetry). FOTA and A-GNSS are off in this sample.
# ---------------------------------------------------------------------------
CONFIG_OSCORE_CLOUD=y
CONFIG_OSCORE_CLOUD_SESSION=y

# The network module (src/network.c) tracks the LTE link state with a kernel
# event object (k_event) so the main connect/send loop can block on, and react
# to, default-PDN activation/deactivation.
CONFIG_EVENTS=y

# ---------------------------------------------------------------------------
# Device observability (Memfault-style): reboot reasons (key 20), a health
# vitals heartbeat (key 21), minimal crash reports (key 22) and static device
# info (key 23), all folded into the ordinary telemetry uplink. The session
# helper attaches them automatically (OSCORE_CLOUD_DIAG_AUTO_ATTACH, default y);
# main.c only calls oscore_cloud_diag_init() once at boot. See OBSERVABILITY.md.
# ---------------------------------------------------------------------------
CONFIG_OSCORE_CLOUD_DIAG=y
CONFIG_OSCORE_CLOUD_DIAG_VITALS=y
CONFIG_OSCORE_CLOUD_DIAG_CRASH=y
CONFIG_OSCORE_CLOUD_DIAG_BREADCRUMBS=y
CONFIG_OSCORE_CLOUD_DIAG_BREADCRUMB_SIZE=1024
CONFIG_OSCORE_CLOUD_DIAG_BUILD_ID=y
CONFIG_OSCORE_CLOUD_DIAG_DEVICE_INFO=y
# Attach the vitals heartbeat on every telemetry send (raise to post fleet
# vitals at a lower cadence than telemetry while sharing the same packet).
CONFIG_OSCORE_CLOUD_DIAG_VITALS_INTERVAL=1

# Reset cause + planned reboot (selected by OSCORE_CLOUD_DIAG, listed for clarity).
CONFIG_HWINFO=y
CONFIG_REBOOT=y

# Vitals sources: heap/stack headroom and CPU busy percent. Modem signal quality
# and airtime vitals reuse CONFIG_MODEM_INFO / CONFIG_LTE_LINK_CONTROL above.
CONFIG_SYS_HEAP_RUNTIME_STATS=y
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_RUNTIME_STATS=y

# Full coredump is off. It was originally disabled because the image did not fit
# the 256 KB application slot alongside the Location + nRF Cloud (A-GNSS request
# plumbing) + cJSON libraries. That constraint is gone -- moving the MCUboot
# secondary slot to external flash gave the application 704 KB (see
# boards/oscore_flash_layout.h) -- so this can be re-enabled now; it also needs a
# coredump_partition nodelabel, which neither board layout defines yet. The
# minimal inline crash report (diag key 22) covers the crash case meanwhile.
CONFIG_DEBUG_COREDUMP=n

# ---------------------------------------------------------------------------
# Persistent storage: the OSCORE Sender Sequence Number (replay counter) is
# saved to NVS so the server does not reject requests as replays after reboot.
# Uses the board's default `storage_partition` on internal flash.
# ---------------------------------------------------------------------------
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# ---------------------------------------------------------------------------
# Shell: one-time bench provisioning via `oscore provision <secret> <salt>
# <sender_id> <recipient_id>` (registered by the oscore_cloud library).
# ---------------------------------------------------------------------------
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_SHELL=y
CONFIG_SHELL_STACK_SIZE=2560
CONFIG_SHELL_CMD_BUFF_SIZE=2048

# Floating point for telemetry values.
CONFIG_PICOLIBC=y
CONFIG_FPU=y

# Logging.
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=2048
# Needed to log the negotiated eDRX/PTW values (floats) from the network module.
CONFIG_CBPRINTF_FP_SUPPORT=y
# Keep the OSCORE cloud library at INF (default): DBG-level strings are rodata
# that no longer fits once the GNSS/location libraries are linked in.
CONFIG_LOCATION_LOG_LEVEL_DBG=y