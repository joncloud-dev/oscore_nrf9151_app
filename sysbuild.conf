#
# Build MCUboot as the bootloader at flash 0x0. On the nRF9151 DK the board's
# flash layout reserves 0x0..0x10000 for the bootloader and links TF-M / the
# application AFTER it, so without MCUboot nothing valid sits at the reset
# address: the device boots into empty flash, faults, and produces no UART
# output. MCUboot boots from 0x0 and chainloads the TF-M secure image.
SB_CONFIG_BOOTLOADER_MCUBOOT=y

# Drop the immutable bootloader (b0) + updatable-MCUboot (s0/s1) chain that the
# Thingy:91 X enables by default for its factory partition layout. This app
# replaces that layout with the nRF9151 DK's -- a single first-stage MCUboot in
# boot_partition -- so that both boards have byte-identical internal flash; see
# boards/thingy91x_flash_partitions.dtsi. A second-stage MCUboot would also
# refuse to build here, since it requires zephyr,code-partition to be s0 or s1.
# No-op on the nRF9151 DK, which never enables secure boot.
SB_CONFIG_SECURE_BOOT_APPCORE=n
