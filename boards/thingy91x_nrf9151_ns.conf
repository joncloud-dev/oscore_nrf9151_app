#
# The predicted-GNSS window ring lives in the pgps_storage partition on the
# on-board external SPI NOR flash (GD25LE255E, 32 MiB on spi3 CS0), so the
# application needs the SPI NOR driver. There is no QSPI on the nRF9151.
#
# Note that settings/NVS is on INTERNAL flash on this target (see
# thingy91x_flash_partitions.dtsi), so CONFIG_SPI_NRFX_RAM_BUFFER_SIZE does not
# need raising: nothing writes rodata-resident buffers over SPIM.
CONFIG_SPI=y
CONFIG_SPI_NOR=y
CONFIG_SPI_NOR_SFDP_DEVICETREE=y
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096

# This app replaces the factory b0 + s0/s1 chain with a single first-stage
# MCUboot (SB_CONFIG_SECURE_BOOT_APPCORE=n in sysbuild.conf), so the immutable
# bootloader is not present and the application must not build against its
# interface. The board's Kconfig.defconfig turns this on by default.
CONFIG_SECURE_BOOT=n
