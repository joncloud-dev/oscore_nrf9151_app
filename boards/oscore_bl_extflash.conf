#
# MCUboot's secondary slot (slot1_partition) is on external SPI NOR on both
# boards, so the bootloader needs the driver to read and swap it. Keeping slot1
# internal instead would cost the application 448 KB of the 1 MiB part -- see
# boards/oscore_flash_layout.h.
CONFIG_SPI=y
CONFIG_SPI_NOR=y
CONFIG_SPI_NOR_SFDP_DEVICETREE=y
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096
