#
# Enable the DK's external SPI NOR flash (GD25WB256, 32 MiB on spi3 CS1). The
# node ships `status = "disabled"` in the board devicetree; the overlay enables
# it and carves out the pgps_storage partition that holds the predicted-GNSS
# window ring. There is no QSPI on the nRF9151, so this is a plain SPI NOR
# driver over SPIM.
CONFIG_SPI=y
CONFIG_SPI_NOR=y
CONFIG_SPI_NOR_SFDP_DEVICETREE=y
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096
